apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-1
  namespace: shared-services
  labels:
    kubernetes.io/service-name: postgres
    endpointslice.kubernetes.io/managed-by: homelab-gitops
addressType: IPv4
ports:
  - name: tcp-postgres
    protocol: TCP
    port: 5432
endpoints:
  - addresses:
      - "10.10.30.100"
    conditions:
      ready: true
