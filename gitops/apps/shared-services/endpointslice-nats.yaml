apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nats-1
  namespace: shared-services
  labels:
    kubernetes.io/service-name: nats
    endpointslice.kubernetes.io/managed-by: homelab-gitops
addressType: IPv4
ports:
  - name: tcp-nats
    protocol: TCP
    port: 4222
  - name: http-nats
    protocol: TCP
    port: 8222
endpoints:
  - addresses:
      - "10.10.30.101"
    conditions:
      ready: true
