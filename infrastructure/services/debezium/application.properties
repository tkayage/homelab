# Sink: NATS JetStream
debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=nats://nats:4222
debezium.sink.nats-jetstream.create-stream=true
# Capture everything Debezium publishes: schema/table events land on
# homelab.<schema>.<table>, and heartbeats on __debezium-heartbeat.<prefix>.
# A too-narrow filter makes JetStream reject publishes with "503 No Responders".
debezium.sink.nats-jetstream.subjects=homelab,homelab.>,__debezium-heartbeat.>

# Source: PostgreSQL
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=60000
debezium.source.database.hostname=10.10.30.100
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.password=${DEBEZIUM_DB_PASSWORD}
debezium.source.database.dbname=postgres
debezium.source.topic.prefix=homelab
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_homelab
# The least-privilege debezium role cannot CREATE PUBLICATION FOR ALL TABLES
# (superuser-only). The publication is pre-created once by the postgres
# superuser (see scripts/postgres-platform.sh configure), so disable autocreate.
debezium.source.publication.name=dbz_publication
debezium.source.publication.autocreate.mode=disabled

# Heartbeat to advance LSN even during idle periods
debezium.source.heartbeat.interval.ms=30000

# Transforms (optional, for routing)
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
