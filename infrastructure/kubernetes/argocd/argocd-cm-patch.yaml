# Patch applied after the upstream Argo CD install.yaml (gitops-platform.sh
# install_argocd). The upstream argocd-cm excludes discovery.k8s.io/EndpointSlice
# from management, which silently drops the manually-authored EndpointSlices that
# back the selectorless shared-services Services (Phase 05). We re-allow
# EndpointSlice while keeping every other default exclusion, including high-churn
# core v1 Endpoints, which we do not author.
data:
  resource.exclusions: |
    ### Core v1 Endpoints stay excluded (auto-generated, high churn); EndpointSlice is NOT excluded so GitOps can manage selectorless-service slices
    - apiGroups:
      - ''
      kinds:
      - Endpoints
    ### Internal Kubernetes resources excluded reduce the number of watched events
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
