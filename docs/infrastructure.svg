<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#334155"/></marker>
    <marker id="am" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1100" fill="#f6f8fa"/>

  <!-- Title -->
  <text x="60" y="46" font-size="24" font-weight="700" fill="#0f172a">Homelab platform infrastructure — kayage.co</text>
  <text x="60" y="72" font-size="13" fill="#475569">Single Proxmox host · Phase 1 approved topology (inventory 2026-07-07) · local-first, public exposure by explicit opt-in</text>

  <!-- ===== Top band: off-host systems ===== -->
  <!-- Mikrotik -->
  <rect x="60" y="100" width="300" height="85" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="78" y="126" font-size="14" font-weight="700" fill="#0f172a">Mikrotik router (RouterOS)</text>
  <text x="78" y="146" font-size="11" fill="#475569">LAN 10.10.30.0/24 · gateway 10.10.30.1</text>
  <text x="78" y="164" font-size="11" fill="#475569">local DNS *.app.kayage.co · static .100–.200</text>

  <!-- LAN clients -->
  <rect x="420" y="108" width="180" height="68" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="443" y="136" font-size="13" font-weight="700" fill="#0f172a">LAN clients</text>
  <text x="443" y="156" font-size="11" fill="#475569">resolve via Mikrotik</text>
  <path d="M 420 142 H 362" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Cloudflare -->
  <rect x="660" y="100" width="310" height="85" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="678" y="126" font-size="14" font-weight="700" fill="#334155">Cloudflare — public edge</text>
  <text x="678" y="146" font-size="11" fill="#475569">zones: kayage.co, hapa.dev</text>
  <text x="678" y="164" font-size="11" fill="#475569">default deny · per-application opt-in only</text>

  <!-- GitHub -->
  <rect x="1140" y="100" width="300" height="85" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1158" y="126" font-size="14" font-weight="700" fill="#0f172a">GitHub + GHCR</text>
  <text x="1158" y="146" font-size="11" fill="#475569">tkayage/gitops-homelab · private images</text>
  <text x="1158" y="164" font-size="11" fill="#475569">GitOps source of truth</text>

  <!-- Edge arrows into host -->
  <path d="M 75 185 V 490 H 103" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="86" y="228" font-size="10.5" fill="#475569">local requests</text>

  <path d="M 715 185 V 215 H 250 V 348" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)"/>
  <text x="450" y="207" font-size="10.5" fill="#64748b">public opt-in (outbound tunnel only)</text>

  <path d="M 1330 185 V 443" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)"/>
  <text x="1322" y="224" font-size="10.5" fill="#64748b" text-anchor="end">GitOps + image pull</text>

  <!-- ===== Proxmox host ===== -->
  <rect x="60" y="240" width="1380" height="700" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="110" y="268" font-size="15" font-weight="700" fill="#0f172a">Proxmox VE host — MS-01 · node “proxmox” · PVE 8.4.19</text>
  <text x="110" y="288" font-size="11.5" fill="#475569">14 cores / 20 threads · 94 GiB RAM · storage local-lvm (≈70 % headroom after build-out) · bridge vmbr0 · 10.10.30.0/24</text>

  <!-- ===== Existing guests group ===== -->
  <rect x="85" y="310" width="330" height="465" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="105" y="332" font-size="11.5" font-weight="700" fill="#64748b">Existing guests — manual-existing</text>

  <!-- Cloudflared -->
  <rect x="105" y="350" width="290" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="121" y="373" font-size="13" font-weight="700" fill="#334155">Cloudflared tunnel</text>
  <text x="121" y="392" font-size="11" fill="#475569">retained LXC · outbound to Cloudflare</text>

  <!-- Cloudflared -> NPM -->
  <path d="M 250 420 V 438" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)"/>

  <!-- NPM -->
  <rect x="105" y="440" width="290" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="121" y="464" font-size="13" font-weight="700" fill="#334155">Nginx Proxy Manager</text>
  <text x="121" y="484" font-size="11" fill="#475569">LXC 111 · 10.10.30.237</text>
  <text x="121" y="502" font-size="11" fill="#475569">proxy.kayage.co · TLS termination</text>
  <circle cx="377" cy="458" r="13" fill="#1e293b"/><text x="377" y="462" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">30</text>

  <!-- Zitadel -->
  <rect x="105" y="560" width="290" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="121" y="584" font-size="13" font-weight="700" fill="#334155">Zitadel — identity (OIDC)</text>
  <text x="121" y="604" font-size="11" fill="#475569">LXC 112 · 10.10.30.236 · zitadel.kayage.co</text>
  <text x="121" y="622" font-size="11" fill="#475569">1 vCPU · 1 GiB · 8 GiB · durable</text>
  <text x="121" y="640" font-size="11" font-style="italic" fill="#64748b">observe-only in Phase 1</text>
  <circle cx="377" cy="578" r="13" fill="#1e293b"/><text x="377" y="582" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">15</text>

  <!-- Frigate -->
  <rect x="105" y="690" width="290" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="121" y="713" font-size="13" font-weight="700" fill="#334155">Frigate NVR</text>
  <text x="121" y="732" font-size="11" fill="#475569">retained LXC</text>

  <!-- ===== New platform guests group ===== -->
  <rect x="430" y="310" width="990" height="560" rx="10" fill="#fbfdff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5" opacity="0.9"/>
  <text x="1408" y="332" font-size="11.5" font-weight="700" fill="#2563eb" text-anchor="end">New platform guests — lifecycle: OpenTofu · in-guest config: config-automation</text>

  <!-- postgres-01 -->
  <rect x="465" y="365" width="280" height="115" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
  <text x="483" y="390" font-size="13" font-weight="700" fill="#1e3a8a">postgres-01 — PostgreSQL</text>
  <text x="483" y="410" font-size="11" fill="#475569">LXC 120 · 10.10.30.100</text>
  <text x="483" y="428" font-size="11" fill="#475569">postgres.app.kayage.co</text>
  <text x="483" y="446" font-size="11" fill="#475569">2 vCPU · 4 GiB · 64 GiB · durable</text>
  <circle cx="727" cy="383" r="13" fill="#1e293b"/><text x="727" y="387" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>

  <!-- services-01 -->
  <rect x="465" y="530" width="380" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
  <text x="483" y="554" font-size="13" font-weight="700" fill="#1e3a8a">services-01 — shared services VM</text>
  <text x="483" y="574" font-size="11" fill="#475569">VM 121 · 10.10.30.101 · services.app.kayage.co</text>
  <text x="483" y="592" font-size="11" fill="#475569">4 vCPU · 8 GiB · 64 GiB · mixed · Docker Compose</text>
  <circle cx="827" cy="548" r="13" fill="#1e293b"/><text x="827" y="552" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">20</text>

  <rect x="495" y="615" width="130" height="75" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="510" y="640" font-size="12.5" font-weight="700" fill="#134e4a">Valkey</text>
  <text x="510" y="659" font-size="10.5" fill="#475569">cache · durable</text>

  <rect x="655" y="615" width="160" height="75" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="670" y="640" font-size="12.5" font-weight="700" fill="#134e4a">NATS JetStream</text>
  <text x="670" y="659" font-size="10.5" fill="#475569">messaging · durable</text>

  <rect x="495" y="715" width="320" height="65" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="510" y="739" font-size="12.5" font-weight="700" fill="#134e4a">Debezium — change data capture</text>
  <text x="510" y="758" font-size="10.5" fill="#475569">ephemeral · needs Postgres + healthy NATS</text>

  <text x="483" y="812" font-size="10.5" font-style="italic" fill="#64748b">Compose owns internal ordering + health checks</text>

  <!-- debezium -> nats -->
  <path d="M 735 715 V 692" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#am)"/>
  <!-- debezium -> postgres (CDC) -->
  <path d="M 495 748 H 448 V 430 H 463" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#am)"/>
  <text x="448" y="418" font-size="10.5" fill="#64748b" text-anchor="middle">CDC</text>

  <!-- k3s-01 -->
  <rect x="990" y="365" width="400" height="330" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
  <text x="1010" y="390" font-size="13" font-weight="700" fill="#1e3a8a">k3s-01 — single-node Kubernetes (k3s)</text>
  <text x="1010" y="410" font-size="11" fill="#475569">VM 122 · 10.10.30.102 · k3s.app.kayage.co</text>
  <text x="1010" y="428" font-size="11" fill="#475569">4 vCPU · 8 GiB · 64 GiB · ephemeral-disposable</text>
  <circle cx="1372" cy="383" r="13" fill="#1e293b"/><text x="1372" y="387" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">40</text>

  <rect x="1010" y="445" width="175" height="55" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1025" y="468" font-size="12.5" font-weight="700" fill="#4c1d95">k3s ingress</text>
  <text x="1025" y="486" font-size="10.5" fill="#475569">*.app.kayage.co</text>

  <rect x="1205" y="445" width="165" height="55" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1220" y="468" font-size="12.5" font-weight="700" fill="#4c1d95">Argo CD</text>
  <text x="1220" y="486" font-size="10.5" fill="#475569">GitOps sync</text>

  <rect x="1010" y="520" width="360" height="70" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1025" y="545" font-size="12.5" font-weight="700" fill="#4c1d95">Application workloads</text>
  <text x="1025" y="564" font-size="10.5" fill="#475569">declarative · rebuildable · no durable data in-cluster</text>

  <path d="M 1097 500 V 518" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#am)"/>
  <path d="M 1287 500 V 518" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#am)"/>

  <text x="1010" y="626" font-size="10.5" font-style="italic" fill="#64748b">Disposable: rebuilding this VM must not lose durable state —</text>
  <text x="1010" y="643" font-size="10.5" font-style="italic" fill="#64748b">databases, streams, and identity live outside the cluster</text>

  <!-- Request path: NPM -> ingress -->
  <path d="M 395 490 H 428 V 338 H 968 V 472 H 1008" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="600" y="330" font-size="10.5" fill="#475569">HTTPS · *.app.kayage.co → k3s ingress</text>

  <!-- k3s dependencies -->
  <path d="M 990 420 H 747" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#am)"/>
  <text x="868" y="412" font-size="10.5" fill="#64748b" text-anchor="middle">SQL</text>

  <path d="M 990 580 H 847" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#am)"/>
  <text x="918" y="572" font-size="10.5" fill="#64748b" text-anchor="middle">cache · streams</text>

  <path d="M 1080 695 V 895 H 422 V 615 H 397" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#am)"/>
  <text x="750" y="887" font-size="10.5" fill="#64748b">OIDC authentication</text>

  <!-- Phase note -->
  <text x="85" y="924" font-size="11" font-style="italic" fill="#64748b">Phase 1 defines and validates this contract only — no provisioning or mutation yet.</text>

  <!-- ===== Legend ===== -->
  <text x="60" y="972" font-size="12" font-weight="700" fill="#0f172a">Legend</text>

  <rect x="60" y="985" width="22" height="14" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="92" y="997" font-size="11" fill="#334155">OpenTofu — guest lifecycle</text>

  <rect x="340" y="985" width="22" height="14" rx="3" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="372" y="997" font-size="11" fill="#334155">config-automation — OS &amp; native services</text>

  <rect x="700" y="985" width="22" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="732" y="997" font-size="11" fill="#334155">Argo CD — Kubernetes desired state</text>

  <rect x="1010" y="985" width="22" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1042" y="997" font-size="11" fill="#334155">manual-existing — retained, observe-only</text>

  <path d="M 60 1032 H 105" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="118" y="1036" font-size="11" fill="#334155">request path</text>

  <path d="M 340 1032 H 385" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#am)"/>
  <text x="398" y="1036" font-size="11" fill="#334155">dependency / data flow</text>

  <circle cx="712" cy="1032" r="11" fill="#1e293b"/><text x="712" y="1036" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">n</text>
  <text x="732" y="1036" font-size="11" fill="#334155">Proxmox boot order (30 s delay each)</text>

  <text x="1010" y="1036" font-size="11" fill="#334155">dashed border — external / opt-in path</text>
</svg>
